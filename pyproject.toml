[project]
name = "koezeg"
version = "0.1.0"
description = "A cow that says things. A practice project for git and GitHub."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
koezeg = "koezeg.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
